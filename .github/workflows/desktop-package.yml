name: Desktop packages
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xyst-windows
          - os: ubuntu-latest
            artifact: xyst-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:package
      - name: Verify Windows update manifest and installer
        if: runner.os == 'Windows'
        run: node scripts/verify-release-metadata.cjs windows release
      - name: Verify Linux update manifest and AppImage
        if: runner.os == 'Linux'
        run: node scripts/verify-release-metadata.cjs linux release
      - name: Ensure Xvfb is available for the Linux renderer smoke
        if: runner.os == 'Linux'
        run: |
          if ! command -v xvfb-run >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends xvfb xauth
          fi
      - name: Smoke test clean Linux AppImage and renderer
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum node scripts/smoke-packaged-linux-gui.mjs
      - name: Smoke test clean Windows install and renderer
        if: runner.os == 'Windows'
        run: node scripts/smoke-packaged-windows-gui.mjs
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
