name: Desktop packages
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: xyst-windows
          - os: ubuntu-24.04
            artifact: xyst-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:package
      - name: Smoke test clean Windows install and renderer
        if: runner.os == 'Windows'
        run: node scripts/smoke-packaged-windows-gui.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error
          retention-days: 14
