[package]
name = "xyst-ai-assistant-desktop"
version = "0.1.2"
description = "Native desktop host for the Xyst AI Assistant local agent"
license = "Apache-2.0"
authors = ["Xyst AI Assistant"]
publish = false
autobins = false
edition = "2021"
rust-version = "1.90"

[features]
sandbox-helper = []

[[bin]]
name = "xyst-desktop"
path = "src/main.rs"

[[bin]]
name = "xyst-sandbox-helper"
path = "src/bin/windows_sandbox_helper.rs"
required-features = ["sandbox-helper"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
base64 = "0.23.1"
png = "0.17.16"
getrandom = "0.3.4"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

[patch.crates-io]
glib = { path = "vendor/glib-0.18.6-xyst" }
