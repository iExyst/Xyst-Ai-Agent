<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#070b1b">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'none'">
    <title>Starting Xyst AI Assistant</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="launch-card" aria-labelledby="launch-title">
      <img class="brand-mark" src="brand-icon.png" alt="">
      <div class="launch-copy">
        <p class="eyebrow">LOCAL CODING PARTNER</p>
        <h1 id="launch-title">Starting Xyst AI Assistant</h1>
        <p class="description">The local agent service is starting. This window will open when it is ready.</p>
        <div class="launch-status" role="status">
          <span class="status-indicator" aria-hidden="true"></span>
          <span>Bringing your local agent online</span>
        </div>
      </div>
    </main>
  </body>
</html>
